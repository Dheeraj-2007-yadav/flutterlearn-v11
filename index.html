<title>FlutterLearn — Learn Flutter</title>

<style>
/* FlutterLearn — premium design system. Mobile-first, system-aware dark mode. */

:root {
  --primary: #02569B;
  --primary-deep: #014a86;
  --accent: #13B9FD;
  --accent-soft: rgba(19, 185, 253, .12);

  --bg: #f4f7fb;
  --bg-elev: #ffffff;
  --bg-sunken: #eaf0f7;
  --text: #0f1f33;
  --text-2: #4a5d75;
  --text-3: #7d8da3;
  --line: #dfe7f1;
  --card-shadow: 0 1px 2px rgba(15, 31, 51, .05), 0 8px 24px -12px rgba(2, 86, 155, .18);
  --card-shadow-hover: 0 2px 4px rgba(15, 31, 51, .06), 0 16px 40px -12px rgba(2, 86, 155, .28);

  --code-bg: #0d1b2e;
  --code-text: #dbe7f5;
  --radius: 18px;
  --radius-s: 12px;
  --nav-h: 64px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #0a1424;
  --bg-elev: #101d33;
  --bg-sunken: #0d1830;
  --text: #e8f1fb;
  --text-2: #a9bcd4;
  --text-3: #6e84a0;
  --line: #1e2f4d;
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .5);
  --card-shadow-hover: 0 2px 6px rgba(0, 0, 0, .35), 0 20px 48px -12px rgba(19, 185, 253, .25);
  --accent-soft: rgba(19, 185, 253, .16);
  --code-bg: #060d1a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  transition: background .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
@media (min-width: 760px) {
  body { padding-bottom: 0; padding-top: var(--nav-h); }
}
::selection { background: var(--accent); color: #fff; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--primary); }
img { max-width: 100%; }

/* ---------- Top nav (desktop/tablet) ---------- */
.topnav {
  display: none;
}
@media (min-width: 760px) {
  .topnav {
    display: flex; align-items: center; gap: 8px;
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 50;
    padding: 0 28px;
    background: color-mix(in srgb, var(--bg-elev) 82%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px;
    letter-spacing: -.02em; color: var(--text); text-decoration: none; margin-right: 18px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff; font-weight: 900; font-size: 18px;
    box-shadow: 0 6px 16px -6px rgba(2, 86, 155, .55);
  }
  .nav-links { display: flex; gap: 4px; margin-left: 8px; }
  .nav-link {
    padding: 9px 15px; border-radius: 999px; font-weight: 600; font-size: 14.5px;
    color: var(--text-2); text-decoration: none; position: relative;
    transition: color .2s, background .2s;
  }
  .nav-link:hover { color: var(--text); background: var(--bg-sunken); }
  .nav-link.active { color: var(--primary); background: var(--accent-soft); }
  [data-theme="dark"] .nav-link.active { color: var(--accent); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
}

/* ---------- Rank chip ---------- */
.rank-chip {
  display: inline-flex; align-items: center; gap: 9px;
  background: var(--bg-elev); border: 1px solid var(--line);
  padding: 7px 14px 7px 8px; border-radius: 999px;
  font-size: 13.5px; font-weight: 700; box-shadow: var(--card-shadow);
  white-space: nowrap; text-decoration: none; color: inherit; cursor: pointer;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
}
.rank-chip:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(2,86,155,.4); }
.rank-dot {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff; font-size: 14px; flex: none;
}
.rank-chip .xp { color: var(--text-3); font-weight: 600; }

/* ---------- Theme toggle ---------- */
.theme-btn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bg-elev); border: 1px solid var(--line); font-size: 17px;
  box-shadow: var(--card-shadow); transition: transform .25s var(--ease);
}
.theme-btn:active { transform: scale(.9) rotate(20deg); }

/* ---------- Mobile sidebar ---------- */
.menu-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; place-content: center;
  background: var(--bg-elev); border: 1px solid var(--line); box-shadow: var(--card-shadow);
  flex: none; transition: transform .15s;
}
.menu-btn span { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--text); margin: 2.4px 0; }
.menu-btn:active { transform: scale(.9); }
@media (min-width: 760px) { .menu-btn { display: none; } }

.side-veil {
  position: fixed; inset: 0; z-index: 90; background: rgba(6, 14, 28, .55);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.side-veil.show { opacity: 1; pointer-events: auto; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 95;
  width: min(300px, 84vw);
  background: var(--bg-elev); border-right: 1px solid var(--line);
  transform: translateX(-104%); transition: transform .38s var(--ease);
  display: flex; flex-direction: column;
  box-shadow: 30px 0 60px -20px rgba(0, 0, 0, .35);
  padding-bottom: env(safe-area-inset-bottom);
}
.sidebar.open { transform: none; }
@media (min-width: 760px) { .sidebar, .side-veil { display: none; } }
body.side-open { overflow: hidden; }
body.modal-open { overflow: hidden; }

.side-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
.side-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; text-decoration: none; color: inherit; }
.side-close {
  width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  background: var(--bg-sunken); color: var(--text-2); font-size: 14px; transition: transform .15s;
}
.side-close:active { transform: scale(.9); }

.side-links { padding: 14px 12px; display: grid; gap: 4px; overflow-y: auto; }
.side-link {
  display: flex; align-items: center; gap: 13px; padding: 12px 14px;
  border-radius: 14px; text-decoration: none; color: var(--text);
  font-weight: 700; font-size: 15.5px; transition: background .2s, transform .15s;
}
.side-link .ico {
  font-size: 19px; width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 11px; background: var(--bg-sunken); flex: none;
}
.side-link .go { margin-left: auto; color: var(--text-3); opacity: 0; transform: translateX(-6px); transition: all .2s; }
.side-link:active { transform: scale(.97); }
.side-link.active { background: var(--accent-soft); color: var(--primary); }
[data-theme="dark"] .side-link.active { color: var(--accent); }
.side-link.active .ico { background: linear-gradient(135deg, var(--primary), var(--accent)); }
.side-link.active .go { opacity: 1; transform: none; }

.side-foot { margin-top: auto; padding: 14px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
/* mobile topbar stays minimal: login/rank live in the slide menu */
.mobile-top [data-auth], .mobile-top .rank-chip { display: none; }
.side-foot .side-auth { display: grid; gap: 10px; }
.side-foot .side-auth .user-chip { justify-content: center; font-size: 14px; }
.side-foot .side-auth .auth-btn { width: 100%; padding: 11px; font-size: 14px; }
.side-theme { width: 100%; border-radius: 14px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; }
#app { flex: 1 0 auto; width: 100%; }

/* ---------- Layout ---------- */
.wrap { max-width: 920px; margin: 0 auto; padding: 22px 18px 40px; }
.wrap.wide { max-width: 1080px; }
@media (min-width: 760px) { .wrap { padding: 34px 28px 60px; } }

.view { animation: viewIn .45s var(--ease); }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: 26px;
  background: linear-gradient(130deg, #014a86 0%, var(--primary) 45%, #0b8fd4 100%);
  color: #fff; padding: 34px 26px; margin-bottom: 22px;
  box-shadow: 0 20px 50px -18px rgba(2, 86, 155, .55);
}
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.16), transparent 70%);
}
.hero::before { width: 340px; height: 340px; top: -140px; right: -80px; animation: drift 9s ease-in-out infinite alternate; }
.hero::after { width: 220px; height: 220px; bottom: -110px; left: 12%; animation: drift 12s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(26px, 18px) scale(1.08); } }
.hero > * { position: relative; z-index: 1; }
.hero-eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .75; margin-bottom: 8px; }
.hero h1 { font-size: clamp(27px, 5.4vw, 40px); font-weight: 800; letter-spacing: -.03em; line-height: 1.12; margin-bottom: 10px; }
.hero p { opacity: .85; font-size: 15.5px; max-width: 52ch; margin-bottom: 20px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 14px 26px; border-radius: 999px; font-weight: 800; font-size: 15.5px;
  text-decoration: none; transition: transform .18s var(--ease), box-shadow .2s, background .2s;
  border: 1px solid transparent;
}
.btn:active { transform: scale(.96); }
.btn-primary {
  background: #fff; color: var(--primary);
  box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(0, 0, 0, .4); }
.btn-accent {
  background: linear-gradient(135deg, var(--primary), #0b8fd4); color: #fff;
  box-shadow: 0 10px 24px -8px rgba(2, 86, 155, .5);
}
.btn-accent:hover { transform: translateY(-2px); }
.btn-ghost {
  background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.btn-ghost:hover { background: rgba(255,255,255,.22); }
.btn-soft { background: var(--accent-soft); color: var(--primary); }
[data-theme="dark"] .btn-soft { color: var(--accent); }
.btn-soft:hover { transform: translateY(-2px); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; transform: none; }

/* ---------- Cards & grids ---------- */
.grid { display: grid; gap: 14px; }
@media (min-width: 640px) { .grid.cols-2 { grid-template-columns: 1fr 1fr; } }

.card {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--card-shadow);
  transition: transform .25s var(--ease), box-shadow .25s;
}
.card.lift:hover { transform: translateY(-4px); box-shadow: var(--card-shadow-hover); }
.stagger > * { animation: cardIn .5s var(--ease) backwards; }
.stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .12s; }
.stagger > *:nth-child(4) { animation-delay: .18s; }
.stagger > *:nth-child(5) { animation-delay: .24s; }
.stagger > *:nth-child(6) { animation-delay: .3s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 14px; }
.section-head h2 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.section-head a { font-size: 14px; font-weight: 700; text-decoration: none; }

/* ---------- Lesson rows ---------- */
.lesson-row {
  display: flex; gap: 16px; align-items: center; padding: 18px;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--card-shadow); text-decoration: none; color: inherit;
  transition: transform .25s var(--ease), box-shadow .25s;
  animation: cardIn .5s var(--ease) backwards;
}
.lesson-row:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-hover); }
.lesson-num {
  width: 52px; height: 52px; border-radius: 16px; flex: none;
  display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow: 0 8px 18px -8px rgba(2, 86, 155, .6);
}
.lesson-row.done .lesson-num { background: linear-gradient(135deg, #0a9b58, #34d399); box-shadow: 0 8px 18px -8px rgba(10, 155, 88, .6); }
.lesson-row .t { flex: 1; min-width: 0; }
.lesson-row .t b { display: block; font-size: 16.5px; letter-spacing: -.01em; }
.lesson-row .t span { color: var(--text-2); font-size: 13.5px; display: block; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lesson-meta { display: flex; align-items: center; gap: 8px; flex: none; }
.xp-pill {
  font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 999px;
  background: var(--accent-soft); color: var(--primary); white-space: nowrap;
}
[data-theme="dark"] .xp-pill { color: var(--accent); }
.done-tick {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: #0a9b58; color: #fff; font-size: 15px; flex: none;
  animation: pop .4s var(--ease);
}
@keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.chev { color: var(--text-3); font-size: 20px; }

/* ---------- Progress / rank card ---------- */
.rank-card {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 22px;
  padding: 24px; box-shadow: var(--card-shadow); margin-bottom: 22px; overflow: hidden; position: relative;
}
.rank-card::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
}
.rank-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.rank-badge {
  width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center;
  font-size: 27px; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow: 0 10px 22px -8px rgba(2, 86, 155, .6);
}
.rank-top b { font-size: 19px; letter-spacing: -.01em; display: block; }
.rank-top span { color: var(--text-2); font-size: 13.5px; }
.xp-big { margin-left: auto; text-align: right; }
.xp-big b { font-size: 26px; letter-spacing: -.02em; display: block; font-variant-numeric: tabular-nums; }
.xp-big span { font-size: 12px; color: var(--text-3); font-weight: 700; }

.pbar { height: 12px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; position: relative; }
.pbar > i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  width: 0; transition: width 1.1s var(--ease); position: relative;
}
.pbar > i::after {
  content: ""; position: absolute; inset: 0; border-radius: 999px;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
  background-size: 200% 100%; animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.pbar-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-top: 8px; font-weight: 600; }

/* ---------- Article / lesson body ---------- */
.article { background: var(--bg-elev); border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; box-shadow: var(--card-shadow); }
@media (min-width: 760px) { .article { padding: 40px 44px; } }
.article h1 { font-size: clamp(26px, 5vw, 36px); letter-spacing: -.03em; line-height: 1.15; margin-bottom: 6px; }
.article h2 { font-size: 22px; letter-spacing: -.02em; margin: 34px 0 12px; padding-top: 6px; }
.article h2:first-of-type { margin-top: 26px; }
.article p { color: var(--text-2); margin: 12px 0; font-size: 16px; }
.article p strong, .article li strong { color: var(--text); }
.article ul, .article ol { margin: 12px 0 12px 4px; padding-left: 20px; color: var(--text-2); }
.article li { margin: 7px 0; font-size: 16px; }
.article li::marker { color: var(--accent); font-weight: 800; }
.article code.inline {
  font-family: var(--mono); font-size: .86em; background: var(--accent-soft);
  color: var(--primary); padding: 2px 7px; border-radius: 7px; font-weight: 600;
}
[data-theme="dark"] .article code.inline { color: var(--accent); }
.lesson-kicker { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
[data-theme="dark"] .lesson-kicker { color: var(--accent); }

.codeblock { margin: 18px 0; border-radius: 16px; overflow: hidden; background: var(--code-bg); box-shadow: 0 14px 34px -14px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.06); }
.code-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); }
.code-head .dots { display: flex; gap: 6px; }
.code-head .dots i { width: 11px; height: 11px; border-radius: 50%; }
.code-head .dots i:nth-child(1) { background: #ff5f57; }
.code-head .dots i:nth-child(2) { background: #febc2e; }
.code-head .dots i:nth-child(3) { background: #28c840; }
.code-head .lang { color: #7d8da3; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.copy-btn {
  margin-left: auto; font-size: 12.5px; font-weight: 700; color: #9fb4d0;
  padding: 6px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
  transition: all .2s;
}
.copy-btn:hover { color: #fff; border-color: var(--accent); background: rgba(19,185,253,.15); }
.copy-btn.ok { color: #34d399; border-color: #34d399; }
.codeblock pre { padding: 18px; overflow-x: auto; font-family: var(--mono); font-size: 13.8px; line-height: 1.65; color: var(--code-text); }
.tok-k { color: #7dd3fc; font-weight: 600; }   /* keyword */
.tok-s { color: #a5d6a7; }                     /* string */
.tok-c { color: #5b6b85; font-style: italic; } /* comment */
.tok-n { color: #f0abfc; }                     /* number */
.tok-a { color: #fcd34d; }                     /* annotation/class */
.tok-f { color: #93c5fd; }                     /* function */

.lesson-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.pager a {
  flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;
  gap: 4px; padding: 16px 18px;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: inherit; font-weight: 700; font-size: 14.5px;
  box-shadow: var(--card-shadow); transition: transform .2s var(--ease);
}
.pager a:hover { transform: translateY(-2px); }
.pager a.next { align-items: flex-end; text-align: right; }
.pager a span { font-size: 12px; color: var(--text-3); font-weight: 600; }
.pager a:empty { visibility: hidden; }

/* ---------- DartPad ---------- */
.dartpad-shell { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--card-shadow); background: var(--bg-elev); }
.dartpad-shell iframe { display: block; width: 100%; height: 420px; border: 0; background: #fff; }
@media (min-width: 760px) { .dartpad-shell iframe { height: 520px; } }
.dartpad-fallback { padding: 26px; text-align: center; color: var(--text-2); font-size: 14.5px; }
.play-note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--radius-s); padding: 14px 16px; font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
.play-note b { color: var(--text); }

/* ---------- Exercise ---------- */
.ex-prompt { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 var(--radius-s) var(--radius-s) 0; padding: 16px 18px; margin: 18px 0; color: var(--text); font-size: 15.5px; }
.hints { margin: 20px 0; display: grid; gap: 10px; }
.hint {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--bg-elev); border: 1.5px dashed var(--line); border-radius: var(--radius-s);
  padding: 14px 16px; font-size: 14.5px; color: var(--text-2);
  transition: border-color .2s, transform .15s;
}
.hint:not(:disabled):hover { border-color: var(--accent); transform: translateX(3px); }
.hint:disabled { cursor: default; }
.hint .n {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--bg-sunken); font-weight: 800; font-size: 13px; color: var(--text-2);
}
.hint.open { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.hint.open .n { background: var(--accent); color: #fff; animation: pop .4s var(--ease); }
.hint .hint-label { flex: 1; }
.hint .hint-text { display: none; flex: 1; }
.hint.open .hint-label { display: none; }
.hint.open .hint-text { display: block; animation: hintIn .5s var(--ease); }
@keyframes hintIn {
  from { opacity: 0; transform: translateY(-10px); }
}

.phone {
  width: 250px; margin: 8px auto 4px; border-radius: 34px; padding: 12px;
  background: #0b1526; box-shadow: 0 24px 50px -18px rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.1);
}
.phone-screen { background: #fff; border-radius: 24px; overflow: hidden; min-height: 300px; display: flex; flex-direction: column; }
.phone-notch { height: 26px; display: grid; place-items: center; background: #fff; }
.phone-notch i { width: 76px; height: 20px; border-radius: 999px; background: #0b1526; display: block; }
.mock-appbar { background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; padding: 12px 14px; }
.mock-body { flex: 1; display: grid; place-items: center; padding: 20px; color: #0f1f33; font-size: 15px; text-align: center; }
.mock-row3 { display: flex; width: 100%; height: 100%; }
.mock-row3 i { flex: 1; }
.expected-cap { text-align: center; font-size: 13px; color: var(--text-3); font-weight: 600; margin-top: 10px; }

.fix-done {
  background: linear-gradient(135deg, rgba(10,155,88,.12), rgba(52,211,153,.08));
  border: 1px solid rgba(10,155,88,.35); border-radius: var(--radius);
  padding: 20px; margin-top: 20px; animation: cardIn .5s var(--ease);
}
.fix-done h3 { color: #0a9b58; margin-bottom: 8px; font-size: 17px; }
.fix-done p { color: var(--text-2); font-size: 15px; }

/* ---------- Quiz ---------- */
.quiz-q { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; box-shadow: var(--card-shadow); }
.quiz-q h3 { font-size: 16.5px; margin-bottom: 14px; letter-spacing: -.01em; }
.quiz-q h3 .qn { color: var(--accent); font-weight: 800; margin-right: 8px; }
.opt { display: block; width: 100%; text-align: left; padding: 13px 16px; margin: 8px 0; border-radius: 13px; border: 1.5px solid var(--line); font-size: 15px; color: var(--text); transition: all .18s; background: var(--bg-elev); }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); transform: translateX(3px); }
.opt.sel { border-color: var(--primary); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(19,185,253,.18); }
.opt:disabled { cursor: default; opacity: .85; }
.opt.correct { border-color: #0a9b58; background: rgba(10,155,88,.1); }
.opt.wrong { border-color: #e5484d; background: rgba(229,72,77,.08); }
.q-explain { margin-top: 12px; padding: 12px 15px; border-radius: 11px; font-size: 14px; background: var(--bg-sunken); color: var(--text-2); animation: cardIn .4s var(--ease); }
.q-explain b { color: var(--text); }

/* one-question quiz flow */
.quiz-progress { display: flex; align-items: center; gap: 12px; margin: 2px 0 16px; }
.quiz-progress > span { font-size: 12.5px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
.quiz-progress .pbar { flex: 1; }
#quiz-next { margin-top: 4px; }
#quiz-next:disabled { opacity: .45; }
.weak-card { text-align: center; margin-top: 16px; }
.weak-card h3 { font-size: 16px; margin: 0 0 4px; }
.weak-card p { color: var(--text-2); font-size: 13.5px; margin: 0; }
.weak-card.good h3 { color: #22b573; }
.weak-tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.weak-tags span { background: var(--bg-sunken); border: 1px solid var(--line); padding: 8px 14px;
  border-radius: 99px; font-size: 13px; font-weight: 700; }

.score-hero { text-align: center; padding: 34px 20px; }
.score-ring {
  width: 148px; height: 148px; margin: 0 auto 18px; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bg-sunken) 0);
  animation: ringIn 1s var(--ease);
}
@keyframes ringIn { from { transform: scale(.6) rotate(-40deg); opacity: 0; } }
.score-ring::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--bg-elev); }
.score-ring b { position: relative; font-size: 34px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.score-hero h2 { font-size: 24px; letter-spacing: -.02em; margin-bottom: 6px; }
.score-hero p { color: var(--text-2); }
.pass-pill { display: inline-block; margin-top: 10px; padding: 7px 18px; border-radius: 999px; font-weight: 800; font-size: 14px; }
.pass-pill.pass { background: rgba(10,155,88,.14); color: #0a9b58; }
.pass-pill.fail { background: rgba(229,72,77,.12); color: #e5484d; }

/* ---------- Rank ladder ---------- */
.ladder { display: grid; gap: 10px; margin-top: 6px; }
.rung {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius-s);
  opacity: .55; transition: all .25s;
}
.rung.reached { opacity: 1; border-color: rgba(19,185,253,.4); }
.rung.now {
  opacity: 1; border-color: var(--accent); background: var(--accent-soft);
  box-shadow: 0 8px 24px -10px rgba(19,185,253,.5); transform: scale(1.015);
}
.rung .ri { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--bg-sunken); flex: none; }
.rung.now .ri { background: linear-gradient(135deg, var(--primary), var(--accent)); }
.rung b { display: block; font-size: 15.5px; }
.rung span { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
.rung .tag { margin-left: auto; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
.stat { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 18px; text-align: center; box-shadow: var(--card-shadow); }
.stat b { font-size: 30px; display: block; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.stat span { font-size: 12.5px; color: var(--text-3); font-weight: 700; }

/* ---------- Rank-up modal ---------- */
.modal-veil {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px;
  background: rgba(6, 14, 28, .62);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-veil.show { opacity: 1; pointer-events: auto; }
.modal-veil.show .modal { animation: popIn .42s cubic-bezier(.2,1.4,.3,1) both; }
@keyframes popIn {
  from { transform: scale(.7) translateY(28px); opacity: 0; }
  to { transform: none; opacity: 1; }
}
.modal {
  background: var(--bg-elev); border-radius: 28px; padding: 40px 34px; text-align: center;
  max-width: 400px; width: 100%; box-shadow: 0 40px 90px -20px rgba(0,0,0,.5);
  transform: scale(.94) translateY(8px); opacity: 0;
  transition: transform .18s ease-in, opacity .18s ease-in; position: relative; overflow: hidden;
}
.modal .trophy { font-size: 64px; display: block; margin-bottom: 12px; animation: trophy .7s var(--ease); }
@keyframes trophy { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.3) rotate(8deg); } 100% { transform: scale(1); } }
.modal h2 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
/* ranks modal: refined, portaled to body */
.modal-ranks { display: flex; flex-direction: column; text-align: left;
  max-height: min(620px, calc(100dvh - 48px)); padding: 32px 28px; }
.modal-ranks h2 { text-align: center; }
.modal-ranks .rl-list { flex: 1; min-height: 0; max-height: none; margin: 14px -6px 18px 0; padding-right: 6px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.modal-ranks .rl-list::-webkit-scrollbar { width: 8px; }
.modal-ranks .rl-list::-webkit-scrollbar-track { background: transparent; }
.modal-ranks .rl-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
.modal-ranks .rl-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }
.modal-ranks .btn-block { flex: none; }
/* logout confirm: redesigned */
.modal-logout { max-width: 360px; padding: 34px 30px 26px; }
.modal-logout .lo-ico { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(239,68,68,.12); color: #ef4444; }
.modal-logout .lo-ico svg { width: 28px; height: 28px; }
.modal.modal-logout h2 { font-size: 20px; letter-spacing: -.01em; text-transform: none;
  color: var(--text); margin-bottom: 8px; }
.modal-logout p { color: var(--text-3); font-size: 14px; line-height: 1.55; margin: 0 0 22px; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-danger:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(239,68,68,.5); }
.btn-danger:active { transform: scale(.96); }
.btn-quiet { background: transparent; color: var(--text-3); margin-top: 6px; }
.btn-quiet:hover { background: var(--bg-sunken); color: var(--text); transform: none; box-shadow: none; }

/* ---------- profile ---------- */
.pf-card { display: flex; align-items: center; gap: 22px; padding: 26px;
  margin-bottom: 20px; animation: cardIn .55s var(--ease) both; }
.pf-card .pf-badge { width: 84px; height: 84px; font-size: 40px; flex: none; margin: 0; }
.pf-info { min-width: 0; }
.pf-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pf-name h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-card .rk-label { margin-top: 6px; }
@media (max-width: 560px) {
  .pf-card { gap: 16px; padding: 20px; }
  .pf-card .pf-badge { width: 66px; height: 66px; font-size: 32px; }
  .pf-name h2 { font-size: 20px; }
}

/* ---------- auth ---------- */
[data-auth] { display: inline-flex; align-items: center; gap: 8px; }
.user-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 800;
  background: var(--accent-soft); color: var(--primary); padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
[data-theme="dark"] .user-chip { color: var(--accent); }
.auth-btn { display: inline-flex; align-items: center; justify-content: center;
  padding: 9px 18px; border-radius: 999px; font-weight: 800; font-size: 14px; text-decoration: none;
  background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff;
  box-shadow: 0 6px 16px -6px rgba(2,86,155,.55); white-space: nowrap; }
.auth-btn:active { transform: scale(.95); }
button.auth-btn { border: 1px solid transparent; font-family: inherit; cursor: pointer; }
.auth-btn.auth-logout { background: transparent; border: 1px solid var(--line); color: var(--text-2); box-shadow: none; }
[data-auth][data-compact] .user-chip { display: none; }
[data-auth][data-compact] .auth-btn { padding: 8px 13px; font-size: 13px; }
.auth-card { max-width: 430px; margin: 0 auto; animation: cardIn .55s var(--ease) both; }
.auth-tabs { display: flex; gap: 4px; background: var(--bg-sunken); border-radius: 14px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 14.5px; color: var(--text-3); }
.auth-tab.active { background: var(--bg-elev); color: var(--text); box-shadow: var(--card-shadow); }
#auth-form label { display: block; text-align: left; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 14px; }
#auth-form input { display: block; width: 100%; margin-top: 7px; font: inherit; font-size: 15px; color: var(--text);
  background: var(--bg-sunken); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
#auth-form input:focus { border-color: var(--accent); }
.auth-err { min-height: 22px; font-size: 13px; font-weight: 700; color: #dc2626; margin: 2px 0 10px; }
.auth-note { margin: 16px 0 0; font-size: 12.5px; color: var(--text-3); text-align: center; font-weight: 600; }
#auth-submit:disabled { opacity: .55; }
.pf-logout { margin-top: 20px; width: 100%; background: #ef4444; border: none; color: #fff; font-weight: 800; }
.pf-logout:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 16px 30px -8px rgba(239,68,68,.5); }
.pf-logout:active { transform: scale(.98); }
@media (min-width: 1000px) { .pf-stats { grid-template-columns: repeat(4, 1fr); } }
.modal .newrank { font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.modal p { color: var(--text-2); font-size: 14.5px; margin-bottom: 22px; }
#confetti { position: fixed; inset: 0; z-index: 101; pointer-events: none; }

/* ---------- Toast ---------- */
.toasts { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 120; display: grid; gap: 8px; width: max-content; max-width: 92vw; }
@media (min-width: 760px) { .toasts { bottom: 26px; } }
.toast {
  background: #0f1f33; color: #fff; padding: 13px 22px; border-radius: 999px;
  font-weight: 700; font-size: 14.5px; box-shadow: 0 14px 34px -10px rgba(0,0,0,.5);
  animation: toastIn .4s var(--ease); display: flex; align-items: center; gap: 10px;
  border: 1px solid rgba(255,255,255,.12);
}
.toast .xpv { color: var(--accent); font-weight: 800; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.94); } }
.toast.out { animation: toastOut .3s forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

/* ---------- Page head ---------- */
.page-head { margin: 6px 0 20px; }
.page-head .crumb { font-size: 13px; font-weight: 700; color: var(--text-3); margin-bottom: 6px; }
.page-head .crumb a { color: var(--text-3); text-decoration: none; }
.page-head h1 { font-size: clamp(26px, 5vw, 36px); letter-spacing: -.03em; line-height: 1.15; }
.page-head p { color: var(--text-2); margin-top: 8px; font-size: 15.5px; max-width: 60ch; }
.back-link { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; color: var(--text-2); text-decoration: none; margin-bottom: 14px; }
.back-link:hover { color: var(--primary); }

.empty { text-align: center; padding: 50px 20px; color: var(--text-3); }
.empty .big { font-size: 46px; display: block; margin-bottom: 10px; }

/* ---------- Home hero (flat, centered) ---------- */
.hero-home {
  text-align: center;
  padding: 42px 10px 36px;
  background: none;
  box-shadow: none;
  border-radius: 0;
  overflow: visible;
  color: inherit;
}
.hero-home::before, .hero-home::after { display: none; }
.hero-home h1 {
  font-size: clamp(42px, 8vw, 68px);
  font-weight: 800; letter-spacing: -.04em; line-height: 1.08;
  margin-bottom: 26px;
}
.hero-home h1 .grad {
  background: linear-gradient(92deg, #3f9dff 10%, #a78bfa 90%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
}
.typer-caret {
  display: inline-block; width: 5px; height: .95em; margin-left: 6px;
  background: var(--text); border-radius: 3px; vertical-align: -.12em;
  animation: caretBlink 1.05s steps(1) infinite;
}
@keyframes caretBlink { 50% { opacity: 0; } }
.hero-home p { margin: 0 auto 30px; text-align: center; font-size: 16.5px; opacity: .72; max-width: 56ch; }
.hero-home .hero-actions { justify-content: center; }
.btn-blue {
  background: #2f8cff; color: #fff;
  padding: 16px 40px; font-size: 16.5px;
  box-shadow: 0 12px 28px -8px rgba(47, 140, 255, .55);
}
.btn-blue:hover { transform: translateY(-2px); background: #4a9dff; }

/* ---------- Home: sections ---------- */
.home-sec { text-align: center; max-width: 580px; margin: 46px auto 6px; padding: 0 6px; }
.home-kicker { font-size: 12.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.home-sec h2 { font-size: clamp(24px, 4.6vw, 34px); font-weight: 800; letter-spacing: -.03em; line-height: 1.16; margin-bottom: 10px; }
.home-sub { color: var(--text-2); font-size: 15.5px; line-height: 1.65; }

/* ---------- Scroll reveals (re-trigger in both directions) ---------- */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity .7s var(--ease), transform .7s var(--ease); will-change: opacity, transform; }
.reveal-left { transform: translateX(-48px); }
.reveal-right { transform: translateX(48px); }
.reveal-scale { transform: scale(.93) translateY(22px); }
.reveal.in { opacity: 1; transform: none; }

/* ---------- Feature showcase ---------- */
.feat {
  display: grid; gap: 20px; align-items: center;
  margin: 30px 0; padding: 24px;
  background: var(--bg-elev); border: 1px solid var(--line);
  border-radius: 24px; box-shadow: var(--card-shadow);
}
@media (min-width: 720px) {
  .feat { grid-template-columns: 1fr 1fr; padding: 36px 40px; gap: 36px; margin: 36px 0; }
  .feat.flip .feat-visual { order: 2; }
}
.feat-visual {
  display: grid; place-items: center; min-height: 200px; padding: 28px 20px;
  background: linear-gradient(135deg, var(--accent-soft), rgba(19,185,253,.04));
  border-radius: 18px; overflow: hidden;
}
.feat-ico { font-size: 30px; margin-bottom: 10px; }
.feat-body h3 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
.feat-body p { color: var(--text-2); font-size: 15px; line-height: 1.65; margin-bottom: 12px; }
.feat-link { font-weight: 800; font-size: 14.5px; color: var(--primary); text-decoration: none; }
[data-theme="dark"] .feat-link { color: var(--accent); }
.feat-link:hover { text-decoration: underline; }

/* feature visuals */
.fv-doc { position: relative; width: 132px; background: #fff; border-radius: 12px; padding: 18px 14px 14px; box-shadow: 0 16px 32px -12px rgba(2,86,155,.35); animation: floaty 5s ease-in-out infinite; }
.fv-doc i { display: block; height: 8px; border-radius: 4px; background: #e2e8f0; margin: 9px 0; }
.fv-doc i.short { width: 55%; }
.fv-pdf { position: absolute; top: -11px; right: 10px; background: #e11d48; color: #fff; font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 8px; letter-spacing: .06em; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-9px) rotate(1.5deg); } }
.fv-code { width: min(300px, 100%); background: #0b1526; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 42px -14px rgba(0,0,0,.55); animation: floaty 6s ease-in-out infinite; }
.fv-bar { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
.fv-bar i { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
.fv-bar i:first-child { background: #f87171; }
.fv-bar i:nth-child(2) { background: #fbbf24; }
.fv-bar i:nth-child(3) { background: #34d399; }
.fv-lines { padding: 8px 14px 4px; }
.fv-lines b { display: block; height: 9px; border-radius: 5px; margin: 10px 0; }
.fv-lines .c1 { background: #38bdf8; width: 72%; }
.fv-lines .c2 { background: #a78bfa; width: 88%; margin-left: 14px; }
.fv-lines .c3 { background: #34d399; width: 58%; margin-left: 28px; }
.fv-lines .c4 { background: #f472b6; width: 42%; margin-left: 14px; }
.fv-run { display: inline-block; margin: 6px 14px 14px; background: #34d399; color: #06281c; font-size: 12px; font-weight: 800; padding: 7px 14px; border-radius: 999px; }
.fv-bug { text-align: center; padding: 22px 10px; }
.fv-bug .bug { font-size: 44px; display: block; animation: wiggle 2.4s ease-in-out infinite; }

   "markdown": "# Lesson 1: Setup & Your First App\n\n## What is Flutter?\n\nFlutter is Google's open-source toolkit for building apps from a **single codebase**. Write your code once in the Dart language, and Flutter compiles it into native apps for Android, iOS, web, and desktop.\n\nThe big idea behind Flutter is simple: **everything on screen is a widget**. Buttons, text, layouts, even the app itself — all widgets, composed together like Lego blocks. You'll see exactly what that means in Lesson 2.\n\n## What you need\n\n1. **Flutter SDK** — download it from flutter.dev and add it to your system PATH.\n2. **An editor** — VS Code with the Flutter extension is the lightest setup and works great.\n3. **Verify** — open a terminal and run `flutter doctor`. It tells you exactly what's missing.\n\nThat's it. No heavy IDE required to start learning.\n\n## The anatomy of a Flutter app\n\nEvery Flutter app follows the same skeleton. Open it up and you'll always find these four pieces:\n\n- **`main()`** — the entry point. Every Dart program starts here.\n- **`runApp()`** — takes your root widget and draws it on the screen.\n- **`MaterialApp`** — the root widget. It gives your app Material Design styling, navigation, and themes for free.\n- **`Scaffold`** — the basic page structure: an app bar on top, a body in the middle.\n\nHere is the smallest real Flutter app:\n\n```dart\nimport 'package:flutter/material.dart';\n\nvoid main() {\n  runApp(const MyApp());\n}\n\nclass MyApp extends StatelessWidget {\n  const MyApp({super.key});\n\n  @override\n  Widget build(BuildContext context) {\n    return MaterialApp(\n      title: 'My First App',\n      home: Scaffold(\n        appBar: AppBar(\n          title: const Text('My First App'),\n        ),\n        body: const Center(\n          child: Text('Hello, Flutter!'),\n        ),\n      ),\n    );\n  }\n}\n```\n\nRead it top to bottom: `main()` runs your app, `MaterialApp` sets it up, `Scaffold` builds the page, and inside the body a `Center` widget holds a `Text` widget saying hello. Widgets inside widgets inside widgets — that nesting is the whole game.\n\n## Key terms\n\n- **main()** — where every Dart program begins execution.\n- **runApp()** — inflates the widget tree and attaches it to the screen.\n- **Widget** — the basic building block of a Flutter UI.\n- **BuildContext** — a handle to the widget's location in the tree (you'll use it constantly).\n\n## Try it yourself\n\nPaste the code above into DartPad (or your editor), press run, and change the text to your own name. Breaking things and fixing them is how this sticks.\n",

   "markdown": "# Lesson 2: Everything Is a Widget\n\n## The one idea that matters\n\nIn Flutter, **everything is a widget**. Text is a widget. A button is a widget. Padding, alignment, rows, columns — widgets. Even your whole app is a widget.\n\nA widget is just a **description of what the UI should look like**. You don't create buttons and move pixels around; you describe the UI you want, and Flutter figures out how to draw it. When something needs to change, you describe the new UI, and Flutter updates the screen.\n\nWidgets form a **tree**: big widgets contain smaller widgets, which contain even smaller ones. That nesting you saw in Lesson 1 *is* the widget tree.\n\n## StatelessWidget\n\nThe simplest kind of widget is a `StatelessWidget` — a widget whose appearance **never changes** once it's built. A label, an icon, a static title: all stateless.\n\nEvery stateless widget overrides one method: **`build()`**. It takes a `BuildContext` and returns the widget tree for this widget:\n\n```dart\nclass Greeting extends StatelessWidget {\n  final String name;\n\n  const Greeting({super.key, required this.name});\n\n  @override\n  Widget build(BuildContext context) {\n    return Text(\n      'Hello, $name!',\n      style: const TextStyle(fontSize: 24),\n    );\n  }\n}\n```\n\nNotice three things: the data comes in through the **constructor** (`name`), the widget is **immutable** (`final`), and `build()` simply **returns** what should appear. No step-by-step drawing instructions anywhere.\n\nYou'd use it like any other widget: `Greeting(name: 'Aarav')`.\n\n## Widgets you will use every day\n\n- **`Text`** — displays a string, with optional styling.\n- **`Icon`** — a Material icon, e.g. `Icon(Icons.star)`.\n- **`Image`** — shows an image from assets or the network.\n- **`ElevatedButton`** — a raised button with an `onPressed` callback.\n\n```dart\nElevatedButton(\n  onPressed: () {\n    print('Button tapped!');\n  },\n  child: const Text('Tap me'),\n)\n```\n\n## Stateless    "markdown": "# Lesson 3: Layout — Row, Column & Container\n\n## How Flutter lays things out\n\nFlutter layout is beautifully simple: widgets are arranged by **parent widgets whose only job is positioning**. Want things side by side? Put them in a `Row`. Stacked vertically? A `Column`. Need padding or a background color? Wrap it in a `Container`.\n\nYou rarely position things with x/y coordinates. You **compose layout widgets**, and Flutter measures everything for you.\n\n## Row and Column\n\n`Row` arranges its children **horizontally**. `Column` arranges them **vertically**. Both take a `children` list:\n\n```dart\nColumn(\n  children: const [\n    Text('First'),\n    Text('Second'),\n    Text('Third'),\n  ],\n)\n```\n\nTwo properties control alignment, and they're worth memorizing:\n\n- **`mainAxisAlignment`** — alignment along the main direction (horizontal for `Row`, vertical for `Column`).\n- **`crossAxisAlignment`** — alignment across it.\n\nSo in a `Column`, `mainAxisAlignment: MainAxisAlignment.center` centers children **vertically**, while `crossAxisAlignment: CrossAxisAlignment.center` centers them **horizontally**. Common values: `start`, `center`, `end`, `spaceBetween`, `spaceEvenly`.\n\n```dart\nRow(\n  mainAxisAlignment: MainAxisAlignment.spaceEvenly,\n  children: const [\n    Icon(Icons.star),\n    Icon(Icons.favorite),\n    Icon(Icons.thumb_up),\n  ],\n)\n```\n\n## Container: the styling workhorse\n\n`Container` is the widget you reach for when you need **padding, margins, background color, borders, or a fixed size**:\n\n```dart\nContainer(\n  padding: const EdgeInsets.all(16),\n  margin: const EdgeInsets.symmetric(vertical: 8),\n  color: Colors.blue,\n  child: const Text(\n    'Inside a container',\n    style: TextStyle(color: Colors.white),\n  ),\n)\n```\n\n`EdgeInsets.all(16)` means 16 pixels on every side. `EdgeInsets.symmetric` lets you set vertical and horizontal separately. You'll type `EdgeInsets` a hundred times — it becomes muscle memory fast.\n\n## Putting it together: a simple card\n\n```dart\nContainer(\n  padding: const EdgeInsets.all(16),\n  margin: const EdgeInsets.all(16),\n  color: Colors.white,\n  child: Row(\n    children: const [\n      Icon(Icons.person, size: 48),\n      SizedBox(width: 16),\n      Column(\n        crossAxisAlignment: CrossAxisAlignment.start,\n        children: [\n          Text('Aarav Sharma', style: TextStyle(fontSize: 20)),\n          Text('Flutter Learner'),\n        ],\n      ),\n    ],\n  ),\n)\n```\n\nA `Container` holds a `Row`; the `Row` holds an icon, a `SizedBox` spacer, and a `Column` of two texts. Layout widgets nesting inside layout widgets — that's 90% of real Flutter UI work.\n\n## The classic beginner error: overflow\n\nIf a `Row`'s children are wider than the screen, Flutter shows the infamous **yellow-and-black striped overflow warning**. The fix is usually wrapping children in `Expanded`, which tells a child to take up the remaining space:\n\n```dart\nRow(\n  children: const [\n    Expanded(child: Text('This text takes all remaining space')),\n    Icon(Icons.arrow_forward),\n  ],\n)\n```\n\nYou'll meet this bug in the quiz below — on purpose.\n\n## Key terms\n\n- **Main axis** — the direction a Row/Column lays children out in.\n- **Cross axis** — the direction perpendicular to the main axis.\n- **Expanded** — forces a child of a Row/Column to fill remaining space.\n- **EdgeInsets** — describes padding and margins.\n",

   "markdown": "# Lesson 4: State & Interactivity\n\n## Why stateless isn't enough\n\nA `StatelessWidget` is frozen after it's built. But real apps change: counters count, text fields fill, toggles flip. For UI that changes over time, Flutter gives you **`StatefulWidget`**.\n\nThe trick: a stateful widget is split in two. The **widget** itself is still immutable and lightweight — it gets thrown away and recreated freely. The **mutable data** lives in a separate `State` object that Flutter keeps alive.\n\n## The pattern\n\n```dart\nclass Counter extends StatefulWidget {\n  const Counter({super.key});\n\n  @override\n  State<Counter> createState() => _CounterState();\n}\n\nclass _CounterState extends State<Counter> {\n  int count = 0; // mutable state lives here\n\n  void _increment() {\n    setState(() {\n      count++;\n    });\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Column(\n      mainAxisAlignment: MainAxisAlignment.center,\n      children: [\n        Text('Count: $count', style: const TextStyle(fontSize: 24)),\n        ElevatedButton(\n          onPressed: _increment,\n          child: const Text('Increment'),\n        ),\n      ],\n    );\n  }\n}\n```\n\nThree things to notice:\n\n1. `createState()` returns the `State` object where your variables live.\n2. **`setState()`** is the magic call. You change your variables *inside* it, and it tells Flutter: \"my data changed, rebuild me.\" Flutter then calls `build()` again with the new values.\n3. `onPressed: _increment` — note there are **no parentheses**. You're passing the function itself as the callback, not calling it.\n\n## The golden rule\n\n**Changing a variable without `setState()` changes the data but not the screen.** Flutter has no idea anything happened, so `build()` never re-runs and the UI stays stale. This single mistake causes half of all beginner \"my button does nothing\" bugs.\n\n```dart\n// WRONG: count changes, screen doesn't\nvoid _increment() {\n  count++;\n}\n\n// RIGHT: screen rebuilds with the new count\nvoid _increment() {\n  setState(() {\n    count++;\n  });\n}\n```\n\n## Where you've seen this before\n\nThink back: `StatelessWidget` describes UI that never changes. `StatefulWidget` + `setState()` is how UI *becomes* changeable. Between Lesson 2's static widgets, Lesson 3's layouts, and this lesson's state, you now have everything needed to build genuinely interactive apps.\n\n## Key terms\n\n- **State** — data that can change over the lifetime of a widget.\n- **setState()** — notifies Flutter that state changed; triggers a rebuild.\n- **State object** — the long-lived companion of a StatefulWidget that holds mutable data.\n",

<script>
/* FlutterLearn — app engine. Views, ranks, quizzes, persistence. */
"use strict";

/* ---------------- helpers ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------------- store (localStorage + memory fallback) ---------------- */
const LS_KEY = "flutterlearn.v1";
let memStore = null;
const store = {
  read() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return memStore; }
  },
  write(s) {
    memStore = s;
    try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
  }
};
function defaultState() {
  return { lessonsDone: {}, quizzesPassed: {}, quizHistory: {},
           last: null, theme: "light", seenRanks: [0] };
}
let S = Object.assign(defaultState(), store.read() || {});
/* migrate v9/v10 best-scores into attempt history */
(function migrateScores() {
  if (!S.quizHistory) S.quizHistory = {};
  if (S.quizScores) {
    let moved = false;
    for (const qid of Object.keys(S.quizScores)) {
      if (!S.quizHistory[qid]) {
        const r = S.quizScores[qid];
        S.quizHistory[qid] = [{ score: r.score, total: r.total,
          pct: Math.round((r.score / r.total) * 100), answers: null, at: 0 }];
        moved = true;
      }
    }
    delete S.quizScores;
    if (moved) save();
  }
})();
function save() { store.write(S); }

/* ---------------- ranks (driven by completed lessons + quizzes) ---------------- */
const RANKS = DATA.ranks;
const QUIZ_PASS = DATA.quiz.passPercent;
function doneCount() {
  return Object.keys(S.lessonsDone || {}).length +
         Object.keys(S.quizzesPassed || {}).length;
}
function rankIndexFor(n) {
  let idx = 0;
  RANKS.forEach((r, i) => { if (n >= r.need) idx = i; });
  return idx;
}
function bumpRank(before, label) {
  save();
  const after = rankIndexFor(doneCount());
  toast(`<span>${esc(label)}</span>`);
  updateRankUI();
  if (after > before) setTimeout(() => showRankUp(after), 450);
  render();
}
function updateRankUI() {
  const i = rankIndexFor(doneCount());
  $$(".rank-chip").forEach(el => {
    el.innerHTML = `<span class="rank-dot">✦</span><span>${esc(RANKS[i].name)}</span>`;
  });
}

function fbInit() {
  try {
    if (typeof firebase === "undefined" || !firebase.auth) return false;

function fbName() {
  const u = FB.user;

}
function fbErr(e) {
  const c = (e && e.code) || "";
  if (c === "auth/email-already-in-use") return "That email is already registered — try logging in.";
  if (c === "auth/invalid-email") return "That email doesn't look right.";
  if (c === "auth/weak-password") return "Password must be at least 6 characters.";
  if (c === "auth/user-not-found") return "No account with that email. Try registering.";
  if (c === "auth/wrong-password" || c === "auth/invalid-credential") return "Wrong email or password.";
  if (c === "auth/too-many-requests") return "Too many attempts — try again later.";
  if (c === "auth/network-request-failed") return "Network error — check your connection.";
  if (c === "auth/operation-not-allowed") return "Email login isn't enabled for this project yet.";
  return "Something went wrong" + (c ? " (" + c + ")" : "") + " — try again.";
}
function currentUser() { return fbName(); }
function logout() {
  if ($("#logout-veil")) return;
  const veil = document.createElement("div");
  veil.className = "modal-veil";
  veil.id = "logout-veil";
  veil.innerHTML = `<div class="modal modal-logout" role="dialog" aria-label="Confirm logout">
    <div class="lo-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
    <h2>Log out?</h2>
    <p>You'll be signed out on this device. Your lessons, quiz history and rank stay saved in this browser.</p>
    <button class="btn btn-danger btn-block" id="logout-confirm">Log out</button>
    <button class="btn btn-quiet btn-block" id="logout-cancel">Cancel</button>
  </div>`;
  document.body.appendChild(veil);
  const close = () => { veil.classList.remove("show"); setTimeout(() => veil.remove(), 250); };
  viewCleanup.push(() => { const v = $("#logout-veil"); if (v) v.remove(); });
  $("#logout-cancel").onclick = close;
  veil.addEventListener("click", e => { if (e.target === veil) close(); });
  const onKey = e => { if (e.key === "Escape") { close(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
  $("#logout-confirm").onclick = () => {
    close();
    if (FB.auth) FB.auth.signOut().catch(() => {});
    toast("Logged out");
  };
  requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.add("show")));
}
function updateAuthUI() {
  const u = currentUser();
  $$("[data-auth]").forEach(el => {
    el.innerHTML = u
      ? `<span class="user-chip">👤 ${esc(u)}</span><button class="auth-btn auth-logout" data-logout>Logout</button>`
      : `<a class="auth-btn auth-login" href="#/profile">Login</a>`;
  });
  $$("[data-logout]").forEach(b => b.onclick = logout);
}

/* ---------------- toast ---------------- */
function toast(html) {
  const box = $(".toasts");
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = html;
  box.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, 2600);
}

/* ---------------- confetti ---------------- */
function confetti() {
  const c = document.createElement("canvas");
  c.id = "confetti";
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#02569B", "#13B9FD", "#34d399", "#fcd34d", "#f0abfc", "#ffffff"];
  const parts = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 220,
    y: innerHeight * .38,
    vx: (Math.random() - .5) * 13, vy: Math.random() * -11 - 4,
    s: Math.random() * 8 + 4, r: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .3, col: colors[(Math.random() * colors.length) | 0],
    life: 1
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .32; p.r += p.vr; p.life -= .008;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.col;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .62); ctx.restore();
    });
    if (++frames < 240) requestAnimationFrame(tick); else c.remove();
  })();
}

/* ---------------- rank-up modal ---------------- */
function showRankUp(idx) {
  const r = RANKS[idx];
  $("#rankup-name").textContent = r.name;
  $("#rankup-veil").classList.add("show");
  confetti();
}
function hideRankUp() { $("#rankup-veil").classList.remove("show"); }
/* lock background scroll while any modal popup is open (covers every veil, present and future) */
function syncModalScrollLock() {
  document.body.classList.toggle("modal-open", !!document.querySelector(".modal-veil.show"));
}
if (typeof MutationObserver !== "undefined") {
  new MutationObserver(syncModalScrollLock).observe(document.body, {
    childList: true, subtree: true, attributes: true, attributeFilter: ["class"]
  });
}

/* ---------------- markdown → html ---------------- */
function highlightDart(code) {
  let src = esc(code);
  src = src.replace(/(\/\/[^\n]*)/g, "\u0001$1\u0002");
  src = src.replace(/('.*?'|".*?")/g, "\u0003$1\u0004");
  src = src.replace(/(@\w+)/g, '<span class="tok-a">$1</span>');
  src = src.replace(/\b(import|void|class|extends|final|const|var|return|if|else|for|while|do|new|this|super|required|late|get|set|async|await|switch|case|break|continue|true|false|null|int|double|bool|String|dynamic|override)\b/g, '<span class="tok-k">$1</span>');
  src = src.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-n">$1</span>');
  src = src.replace(/\b([A-Z][A-Za-z0-9_]*)\b/g, '<span class="tok-a">$1</span>');
  src = src.replace(/([a-zA-Z_][a-zA-Z0-9_]*)(?=\s*\()/g, '<span class="tok-f">$1</span>');
  src = src.replace(/\u0001([\s\S]*?)\u0002/g, '<span class="tok-c">$1</span>');
  src = src.replace(/\u0003([\s\S]*?)\u0004/g, '<span class="tok-s">$1</span>');
  return src;
}
function inlineFmt(s) {
  let out = esc(s);
  out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/`([^`]+?)`/g, "<code class=\"inline\">$1</code>");
  return out;
}
function mdToHtml(md) {
  const parts = md.split(/```(\w*)\n/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) { // code fence
      const lang = parts[i] || "dart";
      const code = parts[i + 1].split("```")[0];
      html += codeBlock(code.replace(/\n$/, ""), lang);
      i++;
      continue;
    }
    html += mdText(parts[i].split("```")[0]);
  }
  return html;
}
function mdText(text) {
  const lines = text.split("\n");
  let html = "", para = [], list = null;
  const flushPara = () => { if (para.length) { html += `<p>${inlineFmt(para.join(" "))}</p>`; para = []; } };
  const flushList = () => { if (list) { html += (list === "ul" ? "<ul>" : "<ol>") + listBuf + (list === "ul" ? "</ul>" : "</ol>"); list = null; listBuf = ""; } };
  let listBuf = "";
  for (const line of lines) {
    const t = line.trim();
    if (!t) { flushPara(); flushList(); continue; }
    if (t.startsWith("## ")) { flushPara(); flushList(); html += `<h2>${inlineFmt(t.slice(3))}</h2>`; continue; }
    if (t.startsWith("# ")) { flushPara(); flushList(); html += `<h1>${inlineFmt(t.slice(2))}</h1>`; continue; }
    const ulm = t.match(/^[-*] (.+)/), olm = t.match(/^\d+\. (.+)/);
    if (ulm || olm) {
      flushPara();
      const kind = ulm ? "ul" : "ol", item = (ulm || olm)[1];
      if (list !== kind) { flushList(); list = kind; }
      listBuf += `<li>${inlineFmt(item)}</li>`;
      continue;
    }
    flushList();
    para.push(t);
  }
  flushPara(); flushList();
  return html;
}
function codeBlock(code, lang) {
  const id = "cb" + Math.random().toString(36).slice(2, 8);
  const highlighted = lang === "dart" ? highlightDart(code) : esc(code);
  return `<div class="codeblock">
    <div class="code-head"><span class="dots"><i></i><i></i><i></i></span>

    <button class="copy-btn" data-copy="${id}">Copy</button></div>
    <pre id="${id}"><code>${highlighted}</code></pre></div>`;
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const pre = document.getElementById(btn.dataset.copy);
  const text = pre ? pre.innerText : "";
  const done = () => { btn.textContent = "Copied ✓"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (err) {}
    ta.remove(); done();
  }
});

let viewCleanup = [];
let progressModalHTML = "";
function onViewCleanup(fn) { viewCleanup.push(fn); }
function runViewCleanup() { while (viewCleanup.length) { try { viewCleanup.pop()(); } catch (e) {} } }
function mqMatches(q) { return (typeof matchMedia === "function") && matchMedia(q).matches; }

const TYPER_WORDS = ["Flutter", "Dart", "Mobile Apps", "Widgets", "Layouts"];
function initTyper() {
  const el = $("#typer-word");
  if (!el) return;
  if (mqMatches("(prefers-reduced-motion: reduce)")) {
    el.textContent = TYPER_WORDS[0];
    const c = $(".typer-caret"); if (c) c.style.display = "none";
    return;
  }
  let wi = 0, ci = 0, del = false, timer = 0, alive = true;
  onViewCleanup(() => { alive = false; clearTimeout(timer); });
  (function tick() {
    if (!alive || !document.contains(el)) return;
    const w = TYPER_WORDS[wi];
    if (!del) {
      el.textContent = w.slice(0, ++ci);
      if (ci >= w.length) { del = true; timer = setTimeout(tick, 1600); }
      else timer = setTimeout(tick, 70 + Math.random() * 60);
    } else {
      el.textContent = w.slice(0, --ci);
      if (ci <= 0) { del = false; wi = (wi + 1) % TYPER_WORDS.length; timer = setTimeout(tick, 350); }
      else timer = setTimeout(tick, 32);
    }
  })();
}
function initReveals() {
  const els = $$(".reveal");
  if (!els.length) return;
  if (!("IntersectionObserver" in window) || mqMatches("(prefers-reduced-motion: reduce)")) {
    els.forEach(e => e.classList.add("in"));
    return;
  }
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(en => en.target.classList.toggle("in", en.isIntersecting));
  }, { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });
  els.forEach(e => obs.observe(e));
  onViewCleanup(() => obs.disconnect());
}
function initHomeFx() { initTyper(); initReveals(); }

      <span class="rk-label">Level ${i + 1} of ${RANKS.length} &middot; ${esc(RANKS[i].name)}</span>
    </div>
  </div>
  <div class="stat-grid stagger pf-stats">
    <div class="stat"><b>${doneL}/4</b><span>Lessons done</span></div>
    <div class="stat"><b>${doneQ}/4</b><span>Quizzes passed</span></div>
    <div class="stat"><b>${attempts}</b><span>Quiz attempts</span></div>
    <div class="stat"><b>${best}%</b><span>Best score</span></div>
  </div>
  <button class="btn pf-logout" id="pf-logout">Logout</button>`;
};

/* ---------------- router ---------------- */
const TABS = [
  { route: "#/home", label: "Home", icon: "🏠", match: ["home"] },
  { route: "#/lessons", label: "Lessons", icon: "📖", match: ["lessons", "lesson"] },
  { route: "#/playground", label: "Play", icon: "⚡", match: ["playground"] },
  { route: "#/quizzes", label: "Quizzes", icon: "❓", match: ["quizzes", "quiz"] },
  { route: "#/progress", label: "Progress", icon: "🏅", match: ["progress"] },
  { route: "#/profile", label: "Profile", icon: "👤", match: ["profile"] },
];
function setActiveTab(root) {
  $$(".side-link").forEach(a => a.classList.toggle("active", a.dataset.match === root));
  $$(".nav-link").forEach(a => a.classList.toggle("active", a.dataset.match === root));
}
function route() {
  runViewCleanup();
  const h = location.hash || "#/home";
  const m = h.match(/^#\/(\w+)(?:\/(\d+))?/);
  const name = (m && m[1]) || "home";
  const arg = m && m[2] ? parseInt(m[2], 10) : null;
  const app = $("#app");
  let html = "", root = name, wide = false;
  if (views[name]) {
    html = arg ? views[name](arg) : views[name]();
    S.last = { route: h };
  } else { html = views.home(); root = "home"; }
  if (name === "playground" || name === "progress") wide = true;
  save();
  app.innerHTML = `<div class="view"><div class="wrap${wide ? " wide" : ""}">${html}</div>
    <div class="foot">FlutterLearn · v42</div></div>`;
  setActiveTab(root);
  updateRankUI();
  updateAuthUI();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$(".pbar > i").forEach(el => { el.style.width = el.dataset.w + "%"; });
    const c = $("[data-count]");
    if (c) {
      const target = +c.dataset.count, t0 = performance.now();
      (function step(t) {
        const p = Math.min(1, (t - t0) / 900);
        c.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    }
  }));
  bindView(name, arg);
  window.scrollTo({ top: 0 });
}
function bindView(name, arg) {
  if (name === "home") initHomeFx();
  if (name === "progress") {
    const help = $("#ranks-help");
    if (help && progressModalHTML) {
      // portal the modal to <body> so no panel stacking context can trap or clip it
      const tmp = document.createElement("div");
      tmp.innerHTML = progressModalHTML;
      const veil = tmp.firstElementChild;
      document.body.appendChild(veil);
      const hide = () => veil.classList.remove("show");
      help.onclick = () => veil.classList.add("show");
      const ok = veil.querySelector("#ranks-ok");
      if (ok) ok.onclick = hide;
      veil.addEventListener("click", e => { if (e.target === veil) hide(); });
      const onKey = e => { if (e.key === "Escape") hide(); };
      document.addEventListener("keydown", onKey);
      onViewCleanup(() => {
        document.removeEventListener("keydown", onKey);
        veil.remove();
        progressModalHTML = "";
      });
    }
  }
  const cl = $("#complete-lesson");
  if (cl) cl.onclick = () => {
    const l = DATA.lessons[arg - 1];
    if (!S.lessonsDone[l.id]) { const b = rankIndexFor(doneCount()); S.lessonsDone[l.id] = true; bumpRank(b, "Lesson complete"); }
  };
  const qz = DATA.quizzes[arg - 1];
  if (qz) {
    const st = quizState[qz.id] || (quizState[qz.id] = { answers: {}, qi: 0, done: false, score: 0 });
    $$("[data-opt]").forEach(b => b.onclick = () => {
      if (st.done) return;
      const qi = Math.min(st.qi, qz.questions.length - 1);
      st.answers[qi] = +b.dataset.opt;
      $$("[data-opt]").forEach(x => x.classList.toggle("sel", x === b));
      const nx = $("#quiz-next");
      if (nx) nx.disabled = false;
    });
    const nx = $("#quiz-next");
    if (nx) nx.onclick = () => {
      const n = qz.questions.length, qi = Math.min(st.qi, n - 1);
      if (st.answers[qi] == null) { toast("Pick an answer first"); return; }
      if (qi < n - 1) {
        st.qi = qi + 1;
        render();
        window.scrollTo({ top: 0 });
        return;
      }
      let score = 0;
      qz.questions.forEach((qq, i) => { if (st.answers[i] === qq.answer) score++; });
      st.score = score; st.done = true;
      const pct = Math.round((score / n) * 100);
      S.quizHistory = S.quizHistory || {};
      const hist = S.quizHistory[qz.id] || (S.quizHistory[qz.id] = []);
      hist.unshift({ score, total: n, pct,
        answers: Object.assign({}, st.answers), at: Date.now() });
      if (hist.length > 5) hist.length = 5;
      if (pct >= QUIZ_PASS && !S.quizzesPassed[qz.id]) {
        const b = rankIndexFor(doneCount());
        S.quizzesPassed[qz.id] = true;
        bumpRank(b, "Quiz passed");
      } else { save(); render(); }
      window.scrollTo({ top: 0 });
    };
  }
  const retry = $("#quiz-retry");
  if (retry) retry.onclick = () => {
    const q = DATA.quizzes[arg - 1];
    quizState[q.id] = { answers: {}, qi: 0, done: false, score: 0 };
    render();
    window.scrollTo({ top: 0 });
  };
  if (name === "profile") {
    const form = $("#auth-form");
    if (form) {
      if (!FB.auth) {
        $("#auth-err").textContent = "Login is unavailable right now — check your connection and reload.";
        $("#auth-submit").disabled = true;
      } else {
        const err = $("#auth-err");
        const say = m => { err.textContent = m; };
        const email = () => $("#auth-email").value.trim();
        const pw = () => $("#auth-pw").value;
        $$(".auth-tab").forEach(t => t.onclick = () => {
          $$(".auth-tab").forEach(x => x.classList.toggle("active", x === t));
          const mode = t.dataset.atab;
          form.dataset.mode = mode;
          $("#auth-submit").textContent = mode === "login" ? "Login →" : "Create account →";
          $$("#auth-form [data-register-only]").forEach(el => el.style.display = mode === "register" ? "" : "none");
          say("");
        });
        form.onsubmit = async e => {
          e.preventDefault(); say("");
          const btn = $("#auth-submit"); btn.disabled = true;
          const done = m => { if (m) say(m); btn.disabled = false; };
          try {
            if (form.dataset.mode === "register") {
              const dname = $("#auth-name").value.trim();
              if (dname.length < 2) return done("Pick a name with at least 2 characters.");
              if ($("#auth-pw2").value !== pw()) return done("Passwords don't match.");
              const cred = await FB.auth.createUserWithEmailAndPassword(email(), pw());
              if (dname) { try { await cred.user.updateProfile({ displayName: dname }); } catch (_) {} }
              toast(`Welcome, ${dname}!`);
              render(); // repaint with the fresh display name (auth event may have fired before updateProfile)
            } else {
              await FB.auth.signInWithEmailAndPassword(email(), pw());
              toast("Welcome back!");
            }
          } catch (ex) { done(fbErr(ex)); }
          btn.disabled = false;
        };
      }
    }
    const lo = $("#pf-logout");
    if (lo) lo.onclick = logout;
  }
}
function render() { route(); }

/* ---------------- theme (light / dark) ---------------- */
function applyTheme() {
  if (S.theme !== "dark" && S.theme !== "light") S.theme = "light"; // migrate old "auto"
  const dark = S.theme === "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const icon = dark ? "☀️" : "🌙";
  $$(".theme-btn").forEach(b => {
    const ic = b.querySelector(".ti");
    if (ic) ic.textContent = icon; else b.textContent = icon;
  });
}
function cycleTheme() {
  S.theme = S.theme === "dark" ? "light" : "dark";
  save(); applyTheme();
  toast(`Theme: ${S.theme}`);
}

/* ---------------- shell ---------------- */
function shell() {
  document.body.innerHTML = `
  <nav class="topnav">
    <a class="brand" href="#/home"><span class="brand-mark">F</span>FlutterLearn</a>
    <div class="nav-links">
      ${TABS.map(t => `<a class="nav-link" data-match="${t.match[0]}" href="${t.route}">${t.label}</a>`).join("")}
    </div>
    <div class="nav-right">${rankChip()}<span data-auth></span><button class="theme-btn" aria-label="Toggle theme">🌙</button></div>
  </nav>
  <main id="app"></main>
  <div class="side-veil" id="side-veil"></div>
  <aside class="sidebar" id="sidebar" aria-hidden="true" aria-label="Menu">
    <div class="side-head">
      <span class="side-brand"><span style="width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:16px;font-weight:900">F</span>FlutterLearn</span>
      <button class="side-close" aria-label="Close menu">✕</button>
    </div>
    <nav class="side-links">
      ${TABS.map(t => `<a class="side-link" data-match="${t.match[0]}" href="${t.route}"><span class="ico">${t.icon}</span><span>${t.label}</span><span class="go">→</span></a>`).join("")}
    </nav>
    <div class="side-foot">
      <div class="side-auth" data-auth></div>
      ${rankChip()}
      <button class="theme-btn side-theme" aria-label="Toggle theme"><span class="ti">🌙</span><span>Theme</span></button>
    </div>
  </aside>
  <div class="modal-veil" id="rankup-veil">
    <div class="modal">
      <span class="trophy">🏆</span>
      <h2>Rank up</h2>
      <div class="newrank" id="rankup-name"></div>
      <p>Your Flutter skills are leveling up. Keep going.</p>
      <button class="btn btn-accent btn-block" id="rankup-ok">Keep learning →</button>
    </div>
  </div>
  <div class="toasts"></div>`;
  $$(".theme-btn").forEach(b => b.onclick = cycleTheme);
  $("#rankup-ok").onclick = hideRankUp;
  $("#rankup-veil").addEventListener("click", (e) => { if (e.target.id === "rankup-veil") hideRankUp(); });
  // mobile sidebar open/close
  const sidebar = $("#sidebar"), sveil = $("#side-veil");
  const openSide = () => { sidebar.classList.add("open"); sveil.classList.add("show"); sidebar.setAttribute("aria-hidden", "false"); document.body.classList.add("side-open"); };
  const closeSide = () => { sidebar.classList.remove("open"); sveil.classList.remove("show"); sidebar.setAttribute("aria-hidden", "true"); document.body.classList.remove("side-open"); };
  sveil.onclick = closeSide;
  $(".side-close").onclick = closeSide;
  $$(".side-link").forEach(a => a.addEventListener("click", closeSide));
  // delegate: sidebar nav, rank chip, and auth buttons (login/logout) all close the menu (survives auth re-renders)
  sidebar.addEventListener("click", (e) => {
    if (e.target.closest(".side-link, .rank-chip, .side-auth a, .side-auth button")) closeSide();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSide(); });
  // mobile top mini-bar with menu button, rank chip + theme (since topnav is desktop-only)
  const mini = document.createElement("div");
  mini.innerHTML = `<div class="mt-bar" style="display:flex;align-items:center;gap:10px;padding:14px 18px 0;max-width:920px;margin:0 auto">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
    <a href="#/home" class="mt-brand" style="display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;text-decoration:none;color:inherit">
    <span class="brand-mark" style="width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:16px;font-weight:900">F</span><span class="brand-name">FlutterLearn</span></a>
    <span class="mt-actions" style="margin-left:auto;display:flex;gap:8px;align-items:center"><span data-auth data-compact></span>${rankChip()}<button class="theme-btn" style="width:36px;height:36px;font-size:15px" aria-label="Toggle theme">🌙</button></span></div>`;
  mini.className = "mobile-top";
  document.body.prepend(mini);
  $("#menu-btn").onclick = openSide;
  $$(".mobile-top .theme-btn").forEach(b => b.onclick = cycleTheme);
  const st = document.createElement("style");
  st.textContent = `@media(min-width:760px){.mobile-top{display:none}}`;
  document.head.appendChild(st);
}

/* ---------------- init ---------------- */
window.__FL_BOOTED = true;
if (window.__FL_TIMER) clearTimeout(window.__FL_TIMER);
shell();
applyTheme();
updateRankUI();
updateAuthUI();
fbInit();
window.addEventListener("hashchange", route);
route();


</script>
</body>
